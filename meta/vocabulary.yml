# Термінологія перекладу. Ворота lang-glossary звіряють вжиті форми з цим списком.
glossary:
  - {en: event loop,          uk: event loop,          note: лишається англійською; «цикл подій» не вживається}
  - {en: GIL,                 uk: GIL,                 note: абревіатура без розкриття й без транслітерації}
  - {en: move semantics,      uk: move semantics,      note: лишається англійською}
  - {en: control block,       uk: control block,       note: термін shared_ptr; лишається англійською}
  - {en: undefined behavior, uk: undefined behavior, note: американське написання; не «невизначена поведінка»}
  - {en: round trip,          uk: round trip,          note: лишається англійською}
  - {en: reflog,              uk: reflog,              note: назва механізму git; не перекладається і не відмінюється}
  - {en: inheritance,         uk: успадкування,        note: завжди цей варіант}
