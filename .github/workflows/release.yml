# Deck release: on a `deck-v*` tag, build the `.apkg` packages and attach them
# to a GitHub Release: the Full Library and the python, embedded and
# electronics decks, each in Ukrainian and in English.
#
# Builds from the TAGGED COMMIT, not from `main`: `actions/checkout` defaults
# to `github.ref`, which for a tag push is the tag itself. A release must be
# reproducible from an immutable point - if it built from whatever `main` had
# moved to by the time the job ran, two runs of the same tag could produce
# different decks. Push the tag at the exact commit you want released.
#
# Or run it manually (`workflow_dispatch`) with a version such as
# `v2026.10.1`: it builds the commit the run was started on and
# `gh release create --target` creates the `deck-<version>` tag on that same
# commit, so the tag still marks exactly what was built. This is the path for
# environments that may push branches but not tags.
#
# Before packaging, the workflow runs the same checks as CI: `iqa validate`,
# the pytest suite (GUID formula, note type shape, which cards ship) and
# `iqa build`, which fails if a `Reference` URL in a card has no page.
name: Deck release

on:
  push:
    tags:
      - "deck-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Deck version, e.g. v2026.10.1 (the release tag becomes deck-<version>)"
        required: true

concurrency:
  group: deck-release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: this workflow only needs to create a release and upload an
# asset to it. It does not touch Pages and does not need `id-token`.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/python-lock.txt

      - name: Install Python dependencies from the lock file
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/python-lock.txt
          python -m pip install --no-deps -e .

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Node dependencies from the lock file
        working-directory: site
        run: npm ci

      - name: Validate content gates
        run: python -m iqa validate

      - name: Run the test suite (includes the Anki-facing checks that exist)
        run: python -m pytest --basetemp="${{ runner.temp }}/pytest"

      - name: Full production build path (produces dist/export/questions.json)
        run: python -m iqa build

      - name: Derive the deck version from the tag or the manual input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then tag="deck-${INPUT_VERSION}"; else tag="${GITHUB_REF_NAME}"; fi
          version="${tag#deck-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the .apkg packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p anki/dist
          for language in uk en; do
            if [ "$language" = uk ]; then root="Interview QA"; else root="Interview QA (EN)"; fi
            python -m iqa deck --language "$language" \
              --out "anki/dist/${root} - Full Library-${VERSION}.apkg"
            for track in python embedded electronics; do
              scope="$(echo "$track" | sed 's/./\U&/')"
              python -m iqa deck --language "$language" --track "$track" \
                --out "anki/dist/${root} - ${scope}-${VERSION}.apkg"
            done
          done
          ls -l anki/dist

      - name: Checksum the release artifacts (release-checksums gate)
        working-directory: anki/dist
        run: |
          for deck in *.apkg; do sha256sum "$deck" > "$deck.sha256"; done
          cat *.sha256

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" anki/dist/*.apkg anki/dist/*.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Interview QA decks ${{ steps.version.outputs.version }}" \
            --generate-notes
